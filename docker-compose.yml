services:
  fraud-api:
    build:
      context: .
    image: fraud-service:dev
    ports:
      - "8000:8000"
    env_file: configs/dev.env              # non-secret dev config, FRAUD_* keys only
    environment:
      FRAUD_REDIS_URL: redis://feature-cache:6379/0
    depends_on:
      feature-cache:
        condition: service_healthy         # gate on REAL readiness, not "started"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/v1/ready"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M                     # discover memory behaviour in dev, not prod

  feature-cache:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5
    volumes:
      - cache-data:/data

volumes:
  cache-data:
