name: ci

on:
  pull_request:                 # gates for every PR
  push:
    branches: [main]            # main additionally publishes the image
  workflow_dispatch:            # manual runs for demos

permissions:
  contents: read                # least privilege by default

concurrency:
  group: ci-${{ github.ref }}   # cancel superseded runs on the same branch
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:                         # cheapest gate first: seconds, not minutes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Ruff (style and common bugs)
        run: ruff check src tests
      - name: Mypy (type-check the seams)
        run: mypy src/fraud_service
      - name: Import contracts (clean-architecture layers)
        run: lint-imports

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Fast suite, including behavioural tests on the real artefact
        run: pytest -m "not slow" --cov --cov-report=term-missing --cov-report=html --cov-fail-under=80
      - name: Upload coverage report
        if: always()            # evidence even on failure
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: htmlcov/

  image-smoke:                  # build once, prove the ARTEFACT works
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build (GitHub Actions layer cache)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true                          # keep the image local for the smoke test
          tags: fraud-service:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container
        run: |
          docker run -d --name svc -p 8000:8000 fraud-service:ci
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS localhost:8000/v1/ready; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then docker logs svc; exit 1; fi
          curl -fsS localhost:8000/v1/predict \
               -H "content-type: application/json" -d @payloads/sample.json \
            | python -c "import json,sys; b=json.load(sys.stdin); assert 0 <= b['fraud_probability'] <= 1; assert b['model_version']; print('smoke OK:', b['decision'])"
          test "$(docker exec svc whoami)" = "appuser"

  publish:                      # delivery: only on main, never on PRs
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [image-smoke]
    permissions:
      contents: read
      packages: write           # scoped token for the GHCR push
    steps:
      - uses: actions/checkout@v6
      - name: Image name must be lowercase
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (commit-SHA tag + branch tag)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          cache-from: type=gha
