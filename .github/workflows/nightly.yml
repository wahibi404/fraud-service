name: nightly
on:
  schedule:
    - cron: "0 1 * * *"         # 04:00 in Riyadh: off-hours for the team
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Everything, including the slow golden-file test
        run: pytest --durations=10
